<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AI added to an existing ASP.NET MVC ticketing application</title>
  <desc id="desc">The browser talks to ASP.NET Core MVC and a Python FastAPI AI service. MVC owns identity and tickets. FastAPI uses Qdrant and SQLite FTS5 for local retrieval, optional OpenAI generation, and Prometheus metrics. Grafana reads Prometheus internally, and an optional ngrok tunnel exposes Grafana only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08172c"/>
      <stop offset="1" stop-color="#142f4d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#8bb4d7"/>
    </marker>
    <style>
      .h { font: 700 31px 'Segoe UI', Arial, sans-serif; fill: #f8fafc }
      .sub { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #a9c2da }
      .title { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #f8fafc }
      .text { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #d7e5f2 }
      .small { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #a9c2da; letter-spacing: 1px }
      .line { fill: none; stroke: #8bb4d7; stroke-width: 2.5; marker-end: url(#arrow) }
      .dash { fill: none; stroke: #93a6bc; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow) }
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1095" cy="94" r="115" fill="#2563eb" opacity=".12"/>
  <circle cx="112" cy="600" r="150" fill="#8b5cf6" opacity=".10"/>
  <text x="54" y="58" class="h">Add AI. Keep the system of record.</text>
  <text x="56" y="86" class="sub">A practical split between application ownership, AI workflows, and operations</text>

  <g filter="url(#shadow)">
    <rect x="48" y="190" width="190" height="300" rx="20" fill="#132b46" stroke="#3b5875"/>
    <rect x="48" y="190" width="190" height="9" rx="5" fill="url(#blue)"/>
    <text x="72" y="236" class="small">USER EXPERIENCE</text>
    <text x="72" y="274" class="title">Browser</text>
    <text x="72" y="306" class="text">Signed-in user</text>
    <text x="72" y="331" class="text">Ticket UI</text>
    <text x="72" y="356" class="text">Help &amp; Copilot</text>
    <rect x="69" y="399" width="146" height="54" rx="12" fill="#173958"/>
    <text x="84" y="423" class="small">HUMAN REVIEW</text>
    <text x="84" y="442" class="text">Suggestions, not writes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="145" width="330" height="390" rx="20" fill="#132b46" stroke="#3b5875"/>
    <rect x="310" y="145" width="330" height="9" rx="5" fill="url(#blue)"/>
    <text x="337" y="190" class="small">EXISTING APPLICATION</text>
    <text x="337" y="227" class="title">ASP.NET Core MVC</text>
    <text x="337" y="257" class="text">Identity • roles • business rules</text>
    <text x="337" y="282" class="text">Ticket authorization • MVC views</text>
    <rect x="337" y="318" width="276" height="83" rx="14" fill="#10233a" stroke="#315273"/>
    <text x="356" y="346" class="small">INTERNAL TICKET API</text>
    <text x="356" y="371" class="text">Short-lived signed user token</text>
    <text x="356" y="390" class="text">Access checks stay in MVC</text>
    <rect x="337" y="423" width="276" height="78" rx="14" fill="#173958"/>
    <text x="356" y="452" class="small">SYSTEM OF RECORD</text>
    <text x="356" y="478" class="text">SQLite ticket database</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="716" y="145" width="300" height="390" rx="20" fill="#132b46" stroke="#3b5875"/>
    <rect x="716" y="145" width="300" height="9" rx="5" fill="url(#violet)"/>
    <text x="743" y="190" class="small">ADDED AI SERVICE</text>
    <text x="743" y="227" class="title">Python / FastAPI</text>
    <text x="743" y="257" class="text">RAG • Help • Agent Copilot</text>
    <rect x="743" y="286" width="246" height="78" rx="14" fill="#10233a" stroke="#4b3b83"/>
    <text x="762" y="315" class="small">LOCAL RETRIEVAL</text>
    <text x="762" y="341" class="text">Qdrant + SQLite FTS5 + reranker</text>
    <rect x="743" y="382" width="112" height="62" rx="12" fill="#173958"/>
    <text x="758" y="408" class="small">OPT-IN</text>
    <text x="758" y="430" class="text">OpenAI</text>
    <rect x="870" y="382" width="119" height="62" rx="12" fill="#173958"/>
    <text x="886" y="408" class="small">METRICS</text>
    <text x="886" y="430" class="text">Prometheus</text>
    <text x="743" y="481" class="text">Ticket text is not indexed in RAG</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="220" width="110" height="116" rx="18" fill="#132b46" stroke="#3b5875"/>
    <rect x="1060" y="220" width="110" height="8" rx="4" fill="url(#green)"/>
    <text x="1080" y="266" class="small">DASHBOARD</text>
    <text x="1080" y="296" class="title">Grafana</text>
    <text x="1080" y="319" class="text">Admin login</text>
  </g>
  <rect x="1060" y="393" width="110" height="76" rx="16" fill="#132b46" stroke="#3b5875"/>
  <text x="1080" y="424" class="small">OPTIONAL</text>
  <text x="1080" y="451" class="title">ngrok</text>

  <path d="M238 283H302" class="line"/>
  <text x="245" y="267" class="small">HTTPS</text>
  <path d="M238 371C275 371 276 358 302 358" class="line"/>
  <text x="247" y="403" class="small">AI TOKEN</text>
  <path d="M640 354H708" class="line"/>
  <text x="646" y="337" class="small">AUTHORIZED READ</text>
  <path d="M1016 414H1052" class="line"/>
  <text x="1016" y="396" class="small">SCRAPED</text>
  <path d="M1115 393V345" class="dash"/>
  <path d="M884 530V572H1117V477" class="dash"/>
  <text x="909" y="600" class="small">OPTIONAL TUNNEL: GRAFANA ONLY</text>

  <text x="52" y="636" class="small">LOCAL-FIRST RETRIEVAL</text>
  <text x="279" y="636" class="small">EXISTING AUTHORIZATION</text>
  <text x="565" y="636" class="small">EXPLICIT DATA-SHARING CONTROLS</text>
</svg>
