<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Local monitoring with optional remote Grafana access</title>
  <desc id="desc">FastAPI sends aggregate metrics to Prometheus over an internal Docker network. Grafana reads Prometheus on the same network. An optional ngrok tunnel exposes Grafana only, protected by Grafana login. Prometheus remains private.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08172c"/><stop offset="1" stop-color="#142f4d"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8bb4d7"/></marker>
    <style>
      .h { font:700 30px 'Segoe UI',Arial,sans-serif;fill:#f8fafc }
      .sub { font:400 15px 'Segoe UI',Arial,sans-serif;fill:#a9c2da }
      .title { font:700 19px 'Segoe UI',Arial,sans-serif;fill:#f8fafc }
      .text { font:400 14px 'Segoe UI',Arial,sans-serif;fill:#d7e5f2 }
      .small { font:600 12px 'Segoe UI',Arial,sans-serif;fill:#a9c2da;letter-spacing:1px }
      .line { fill:none;stroke:#8bb4d7;stroke-width:2.5;marker-end:url(#arrow) }
      .dash { fill:none;stroke:#4ade80;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow) }
    </style>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <text x="52" y="58" class="h">Observe locally. Share the dashboard selectively.</text>
  <text x="54" y="86" class="sub">Grafana reads Prometheus privately; the optional ngrok profile tunnels Grafana only</text>
  <rect x="58" y="128" width="790" height="252" rx="22" fill="#10233a" stroke="#47627d" stroke-dasharray="9 7"/>
  <text x="86" y="160" class="small">DOCKER MONITORING NETWORK</text>
  <g filter="url(#shadow)">
    <rect x="100" y="207" width="210" height="115" rx="18" fill="#132b46" stroke="#3b5875"/>
    <rect x="100" y="207" width="210" height="8" rx="4" fill="#a78bfa"/>
    <text x="124" y="252" class="small">METRIC SOURCE</text>
    <text x="124" y="282" class="title">FastAPI</text>
    <text x="124" y="305" class="text">Aggregate metrics</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="392" y="207" width="190" height="115" rx="18" fill="#132b46" stroke="#3b5875"/>
    <rect x="392" y="207" width="190" height="8" rx="4" fill="url(#teal)"/>
    <text x="416" y="252" class="small">TIME SERIES</text>
    <text x="416" y="282" class="title">Prometheus</text>
    <text x="416" y="305" class="text">Private UI / scrape</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="664" y="207" width="150" height="115" rx="18" fill="#132b46" stroke="#3b5875"/>
    <rect x="664" y="207" width="150" height="8" rx="4" fill="url(#green)"/>
    <text x="688" y="252" class="small">DASHBOARD</text>
    <text x="688" y="282" class="title">Grafana</text>
    <text x="688" y="305" class="text">Login required</text>
  </g>
  <path d="M310 264H384" class="line"/>
  <path d="M582 264H656" class="line"/>
  <text x="319" y="245" class="small">SCRAPE</text>
  <text x="588" y="245" class="small">QUERY</text>
  <g filter="url(#shadow)">
    <rect x="936" y="207" width="198" height="115" rx="18" fill="#132b46" stroke="#3b5875"/>
    <rect x="936" y="207" width="198" height="8" rx="4" fill="#fb923c"/>
    <text x="960" y="252" class="small">OPTIONAL HTTPS</text>
    <text x="960" y="282" class="title">ngrok</text>
    <text x="960" y="305" class="text">Grafana endpoint only</text>
  </g>
  <path d="M814 264H928" class="dash"/>
  <text x="850" y="245" class="small">TUNNEL</text>
  <text x="72" y="414" class="small">PROMETHEUS IS NOT EXPOSED BY THE NGROK PROFILE</text>
</svg>
